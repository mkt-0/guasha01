<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="刮痧预约">
  <meta name="theme-color" content="#1a5f7a">
  <title>刮痧工作室预约</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
</head>
<body>
  <div class="container">
    <header>
      <h1>刮痧工作室</h1>
      <p class="subtitle">预约仪表盘 · 手机专用</p>
    </header>

    <section class="today-section">
      <h2>今日预约</h2>
      <div id="today-list" class="appointment-list"></div>
    </section>

    <section class="actions">
      <button id="add-btn" class="btn-primary large">➕ 添加新预约</button>
      <button id="calendar-btn" class="btn-secondary">📅 添加到日历（自动提醒）</button>
      <button id="export-btn" class="btn-secondary">📋 复制今日名单</button>
    </section>

    <section class="upcoming-section">
      <h2>近期预约（未来7天）</h2>
      <div id="upcoming-list" class="appointment-list"></div>
    </section>

    <section class="all-section">
      <h2>全部预约记录</h2>
      <div id="all-list" class="appointment-list"></div>
    </section>

    <section class="help-section">
      <h2>怎么用（只需看一次）</h2>
      <p>1. 用iPhone的Safari打开这个页面</p>
      <p>2. 点底部分享按钮 →「添加到主屏幕」</p>
      <p>3. 之后从桌面图标打开，就像APP一样</p>
      <p>4. 添加预约后，点「添加到日历」，会自动进手机日历并设置提醒</p>
    </section>
  </div>

  <!-- 添加/编辑弹窗 -->
  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <h3 id="modal-title">添加预约</h3>
      <form id="appointment-form">
        <input type="hidden" id="edit-id">
        <label>客人姓名 *</label>
        <input type="text" id="name" required placeholder="例如：张阿姨" autocomplete="off">

        <label>联系电话</label>
        <input type="tel" id="phone" placeholder="11位手机号" autocomplete="off">

        <label>日期 *</label>
        <input type="date" id="date" required>

        <label>时间 *</label>
        <input type="time" id="time" required>

        <label>项目</label>
        <select id="service">
          <option value="刮痧">刮痧</option>
          <option value="拔罐">拔罐</option>
          <option value="刮痧+拔罐">刮痧+拔罐</option>
          <option value="其他">其他</option>
        </select>

        <label>备注</label>
        <textarea id="notes" rows="2" placeholder="身体部位、特殊要求等"></textarea>

        <div class="form-actions">
          <button type="submit" class="btn-primary">保存</button>
          <button type="button" id="cancel-btn" class="btn-secondary">取消</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
